services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LOANFLOW_API_KEY: ${LOANFLOW_API_KEY:?Set a random API key of at least 32 characters}
      LOANFLOW_RELEASES: /releases
    volumes:
      - ./releases:/releases:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
