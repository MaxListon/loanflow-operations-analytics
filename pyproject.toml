[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loanflow-analytics"
version = "2.0.0"
description = "Reproducible loan operations intelligence using BPI Challenge 2017"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.2,<3", "pandas>=2.2,<4", "numpy>=2,<3", "scipy>=1.14,<2", "scikit-learn>=1.5,<2", "plotly>=6,<8", "streamlit>=1.45,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "pytest-cov>=5,<8"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
notebook = ["ipykernel>=6,<8", "nbformat>=5,<6", "nbclient>=0.10,<1"]

[project.scripts]
loanflow = "loanflow.pipeline:main"
loanflow-release = "loanflow.release:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
